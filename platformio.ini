; IoT-Env-Monitor — Local ESP32-S3 Firmware Build Configuration (Linux Ubuntu VM)
;
; Firmware C/C++ sources, TFLite Micro INT8 headers, and LittleFS dashboard assets are
; coded, compiled, flashed, and monitored locally inside the Linux Ubuntu virtual machine
; over hypervisor USB CDC passthrough (/dev/ttyACM0). Firmware and the embedded port-80
; web server run strictly on the Yolo Uno ESP32-S3 / local Wi-Fi LAN (never deployed on
; Cloudflare); only outbound POST /sensor telemetry targets the *.workers.dev gateway.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
boards_dir = firmware/boards
data_dir = firmware/data

[env:yolo_uno]
platform = espressif32@7.1.3
board = yolo_uno
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Default Linux Ubuntu VM USB CDC passthrough port for local upload and Serial monitor:
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    ESP32Async/ESPAsyncWebServer@3.12.1
    bblanchon/ArduinoJson@7.4.3
    ayushsharma82/ElegantOTA@4.0.0
    robtillaart/DHT20@0.3.3

lib_compat_mode = strict
