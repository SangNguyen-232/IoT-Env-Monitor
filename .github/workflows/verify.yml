name: Verify repository
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  layout-and-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/project/check_layout.py
      - run: python tools/project/test_firmware.py
      - run: python -m pip install platformio==6.2.0
      - name: Use non-production build configuration
        run: cp firmware/include/config/secrets.h.example firmware/include/config/secrets.h
      - run: pio run -e yolo_uno
      - run: pio run -e yolo_uno --target buildfs

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: iot_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.2.0
      - run: npm --prefix services/backend ci
      - run: npm --prefix services/backend run check
      - run: npm --prefix services/backend test
        env:
          DB_TEST_URL: postgresql://iot_test:ci_test_only@127.0.0.1:5432/postgres
      - run: npm --prefix services/gateway ci
      - run: npm --prefix services/gateway test
      - run: npm --prefix services/gateway run check
      - run: node --check firmware/data/dashboard.js
      - name: Validate deployment paths with example values
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f infra/compose/postgres16.override.yml config --quiet
