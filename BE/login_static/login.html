<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng nhập – ESP32 IoT</title>
<style>
  :root {
    --bg:       #0b1220;
    --surface:  #0d1526;
    --card:     #131c30;
    --border:   rgba(255,255,255,0.07);
    --text:     #eef1f8;
    --muted:    #828ba3;
    --accent:   #3b6df0;
    --accent-h: #4f7df5;
    --green:    #2ecc71;
    --red:      #ef4444;
    --red-soft: rgba(239,68,68,0.12);
    --purple:   #b06af7;
    --radius:   14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Decorative dotted grid background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(59,109,240,0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .login-wrap {
    width: 100%;
    max-width: 380px;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  /* ── Brand ── */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    color: #fff;
    flex-shrink: 0;
  }

  .brand-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* ── Card ── */
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 24px;
  }

  .login-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  /* ── Form ── */
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .field input {
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,109,240,0.18);
  }

  .field input::placeholder { color: var(--muted); }

  /* ── Password show/hide wrapper ── */
  .pwd-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .pwd-wrap input {
    width: 100%;
    padding-right: 38px;
  }

  .btn-eye {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    line-height: 1;
    transition: color 0.15s;
  }

  .btn-eye:hover { color: var(--text); }
  .btn-eye svg { width: 16px; height: 16px; }

  /* ── Button ── */
  .btn-login {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 9px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-login:hover  { background: var(--accent-h); }
  .btn-login:active { transform: translateY(1px); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ── Small button spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-spinner {
    display: none;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  .btn-login.loading .btn-spinner { display: block; }
  .btn-login.loading .btn-text   { opacity: 0.7; }

  /* ── Error message ── */
  .login-err {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--red-soft);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 8px;
    font-size: 13px;
    color: var(--red);
  }

  .login-err.show { display: block; }

  /* ── Success message ── */
  .login-ok {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(46,204,113,0.12);
    border: 1px solid rgba(46,204,113,0.25);
    border-radius: 8px;
    font-size: 13px;
    color: var(--green);
  }

  .login-ok.show { display: block; }

  /* ── Switch link ── */
  .switch-link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  .switch-link button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

  .switch-link button:hover { color: var(--accent-h); }

  /* ── Footer note ── */
  .login-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="login-wrap">

  <div class="brand">
    <span class="brand-mark">E</span>
    <span class="brand-name">ESP32 IoT</span>
  </div>

  <div class="login-card">
    <div class="login-title" id="cardTitle">Đăng nhập hệ thống</div>
    <div class="login-sub" id="cardSub">Nhập tài khoản được cấp để tiếp tục</div>

    <div class="field">
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" placeholder="username" autocomplete="username" autofocus />
    </div>

    <div class="field">
      <label for="password">Mật khẩu</label>
      <div class="pwd-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="btn-eye" data-target="password" aria-label="Hiện/ẩn mật khẩu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="btnSubmit">
      <span class="btn-spinner"></span>
      <span class="btn-text">Đăng nhập</span>
    </button>

    <div class="login-err" id="loginErr"></div>
    <div class="login-ok" id="loginOk"></div>
  </div>

  <div class="login-note">Tài khoản do quản trị viên cấp. Đăng ký công khai đã tắt.</div>

</div>

<script>
(function () {
  var usernameEl      = document.getElementById('username');
  var passwordEl      = document.getElementById('password');
  var btnSubmit       = document.getElementById('btnSubmit');
  var errEl           = document.getElementById('loginErr');
  var okEl            = document.getElementById('loginOk');

  function setError(msg) {
    errEl.textContent = msg;
    errEl.classList.add('show');
    okEl.classList.remove('show');
  }

  function clearMessages() {
    errEl.classList.remove('show');
    okEl.classList.remove('show');
  }

  function setLoading(on) {
    btnSubmit.disabled = on;
    btnSubmit.classList.toggle('loading', on);
  }

  function doLogin() {
    clearMessages();
    var username = usernameEl.value.trim();
    var password = passwordEl.value;

    if (!username || !password) {
      setError('Vui lòng nhập tên đăng nhập và mật khẩu.');
      return;
    }

    setLoading(true);

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
      .then(function (result) {
        setLoading(false);
        if (result.data.ok) {
          window.location.href = '/admin/admin.html';
        } else {
          setError(result.data.error || 'Đăng nhập thất bại.');
          passwordEl.value = '';
          passwordEl.focus();
        }
      })
      .catch(function () {
        setLoading(false);
        setError('Không kết nối được server. Thử lại sau.');
      });
  }

  btnSubmit.addEventListener('click', doLogin);

  [usernameEl, passwordEl].forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') btnSubmit.click();
    });
  });

  var EYE_SHOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_HIDE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  document.querySelectorAll('.btn-eye').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-target'));
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_HIDE : EYE_SHOW;
    });
  });
})();
</script>
</body>
</html>
