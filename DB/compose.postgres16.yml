# Rollback/legacy startup only. Run with -f docker-compose.yml first.
# Requires Docker Compose >=2.24.4 for !override.
services:
  postgres:
    image: postgres:16.15-alpine3.24
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      - ./DB/DB.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./DB/auth_migration.sql:/docker-entrypoint-initdb.d/02_auth.sql
volumes:
  pgdata:
    driver: local
